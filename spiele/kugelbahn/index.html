<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kugelbahn Koop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Figma-artige Werkbank — Ebenen links, unendliche Canvas mittig, kontextueller Inspector rechts */
:root{
  --bg:#e6e8e7; --panel:#f5f6f5; --raised:#ffffff; --ink:#191b1a; --muted:#5b625f; --line:#d2d6d4;
  --accent:#7a4bff; --accent-soft:#ece5ff; --accent-ink:#ffffff;
  --warn:#e2461c; --ok:#178a49; --stage:#dcdfdd;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121413; --panel:#1a1d1c; --raised:#232726; --ink:#e6ebe8; --muted:#98a19d; --line:#303533;
  --accent:#a587ff; --accent-soft:#2a2340; --accent-ink:#110d1c; --warn:#ff6a3f; --ok:#3fca7c; --stage:#0f1110; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#121413; --panel:#1a1d1c; --raised:#232726; --ink:#e6ebe8; --muted:#98a19d; --line:#303533;
  --accent:#a587ff; --accent-soft:#2a2340; --accent-ink:#110d1c; --warn:#ff6a3f; --ok:#3fca7c; --stage:#0f1110; color-scheme:dark; }

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px 14px;box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
kbd{font-family:var(--f-mono);font-size:10.5px;padding:0 4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--raised);color:var(--ink);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-ball{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b996ff,#7a4bff 55%,#4e22c9)}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0;line-height:1}
.tools{display:flex;gap:2px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:3px}
.tool{width:34px;height:30px;border:0;background:transparent;border-radius:7px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.tool:hover{background:var(--accent-soft)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool svg{width:16px;height:16px}
.sep{width:1px;background:var(--line);margin:3px 3px}
.modes{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg{border:0;background:transparent;padding:5px 13px;border-radius:999px;cursor:pointer;font-weight:600;display:flex;gap:7px;align-items:center}
.seg.on{background:var(--ink);color:var(--bg)}
.seg.on kbd{background:transparent;color:inherit;border-color:currentColor}
#modeTest.on{background:var(--accent);color:var(--accent-ink)}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.danger{color:var(--warn)}
.btn.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{width:32px;padding:5px 0;text-align:center}

.work{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr) 292px;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;min-height:0;padding:12px;display:flex;flex-direction:column;gap:10px}
.panel h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:2px 0 0;font-weight:600}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pre{display:flex;align-items:center;gap:6px;background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:4px 6px;cursor:grab;touch-action:none;user-select:none;font-size:12px;text-align:left;min-width:0}
.pre svg{width:28px;height:18px;flex:none}
.pre span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pre:hover{border-color:var(--accent)}
.pre.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.layers{display:flex;flex-direction:column;gap:1px}
.lay{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;user-select:none;min-width:0}
.lay:hover{background:var(--accent-soft)}
.lay.on{background:var(--accent);color:var(--accent-ink)}
.lay.sec{font-weight:600}
.lay.el{padding-left:22px;font-size:12px}
.lay .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay .ct{font-family:var(--f-mono);font-size:11px;opacity:.7}
.lay svg{width:13px;height:13px;flex:none}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.sw.round{border-radius:50%}
.lay .tag{font-size:10px;font-family:var(--f-mono);opacity:.75}

.stage{position:relative;min-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--stage)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.overlay-tl{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.chip.mode{font-family:var(--f-ui);font-weight:600}
.chip.mode.test{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.chip{cursor:pointer;font-family:var(--f-ui)}
button.chip:hover{border-color:var(--accent)}
.crumbsep{color:var(--muted)}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 16px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}
.banner.fail{background:var(--warn);color:#fff}
.banner.win{background:var(--ok);color:#fff;font-family:var(--f-display);font-size:16px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center}
.zoom .chip{min-width:52px;text-align:center}
.tips{position:absolute;left:10px;bottom:10px;right:230px;font-size:11.5px;color:var(--muted);line-height:1.6;pointer-events:none}
.tips kbd{font-size:10px}

.insp{display:flex;flex-direction:column;gap:9px}
.insp h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:-.01em}
.insp .sub{color:var(--muted);font-size:12px;margin:-4px 0 0;line-height:1.45}
.insp h4{margin:6px 0 0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
.row>span:first-child{color:var(--muted);font-size:12px}
.inp{display:flex;align-items:center;gap:6px;min-width:0}
.inp input,.row select,.txt{width:100%;min-width:0;box-sizing:border-box;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:var(--f-mono);font-size:12px}
.row select,.txt{font-family:var(--f-ui);font-size:13px}
.inp em{font-style:normal;color:var(--muted);font-size:11px;font-family:var(--f-mono);flex:none}
.inp input:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.grid2 .row{grid-template-columns:20px minmax(0,1fr)}
.seg2{display:flex;gap:3px;flex-wrap:wrap}
.seg2 button{flex:1;display:flex;align-items:center;gap:5px;justify-content:center;border:1px solid var(--line);background:var(--raised);border-radius:6px;padding:5px 6px;cursor:pointer;font-size:12px;white-space:nowrap}
.seg2 button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.check{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts .btn{flex:1}
.srow{display:flex;flex-direction:column;gap:2px}
.srow .lab{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
.srow output{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.srow input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.srow small,.hint{color:var(--muted);font-size:11px;line-height:1.4}
details{border-top:1px solid var(--line);padding-top:6px}
details>summary{cursor:pointer;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:3px 0;list-style:none;display:flex;justify-content:space-between}
details>summary::after{content:"+";font-family:var(--f-mono)}
details[open]>summary::after{content:"–"}
details>div{display:flex;flex-direction:column;gap:8px;padding:6px 0 4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;color:var(--muted);align-items:center}
.keys span:nth-child(odd){text-align:right}
.callout{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45}

.modal{position:fixed;inset:0;background:rgba(10,12,11,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(640px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
.mbox h3{font-family:var(--f-display);font-size:19px;margin:0}
.mbox p{margin:0;color:var(--muted);line-height:1.45}
.mbox textarea{width:100%;box-sizing:border-box;height:220px;background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink);resize:vertical}
.mrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.msg{font-size:12px;color:var(--ok);min-height:1em}
.ghost{position:fixed;pointer-events:none;z-index:30;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:999px;font-weight:600;font-size:12px;transform:translate(-50%,-140%)}

@media (max-width: 1050px){
  html,body{height:auto} body{overflow:auto} #app{height:auto}
  .work{grid-template-columns:minmax(0,1fr)}
  .stage{height:72vh;order:-1}
  .modes{margin-left:0}
  .tips{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div id="app">
  <header class="top">
    <div class="brand"><span class="brand-ball" aria-hidden="true"></span><h1>Kugelbahn Koop</h1></div>
    <div class="tools" id="tools">
      <button class="tool" data-tool="select" title="Auswählen (V)" type="button"><svg viewBox="0 0 16 16"><path d="M3.5 2 L12.5 8.2 L8.3 9 L6.4 13.4 Z" fill="currentColor"/></svg></button>
      <button class="tool" data-tool="hand" title="Hand / Verschieben (H, oder Leertaste halten)" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5.5 8V3.6a1 1 0 0 1 2 0V7.5M7.5 7V2.7a1 1 0 0 1 2 0V7.5M9.5 7.5V3.6a1 1 0 0 1 2 0v4.6M11.5 8V5.6a1 1 0 0 1 2 0v4c0 3-2 5-4.6 5-2 0-3.1-.9-4.1-2.4L3 9.6a1 1 0 0 1 1.6-1.2L5.5 9.6"/></svg></button>
      <span class="sep"></span>
      <button class="tool" data-tool="section" title="Spielfeld aufziehen (F)" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 1.5v13M11 1.5v13M1.5 5h13M1.5 11h13"/></svg></button>
      <button class="tool" data-tool="rect" title="Rechteck / Balken (R)" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4.5" width="12" height="7" rx=".5"/></svg></button>
      <button class="tool" data-tool="circle" title="Kreis (O)" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/></svg></button>
    </div>
    <div class="modes">
      <button class="seg on" id="modeBuild" type="button">Bauen <kbd>Esc</kbd></button>
      <button class="seg" id="modeTest" type="button">Testen <kbd>Enter</kbd></button>
    </div>
    <button class="btn iconbtn" id="undoBtn" type="button" title="Rückgängig (Ctrl+Z)">↶</button>
    <button class="btn iconbtn" id="redoBtn" type="button" title="Wiederholen (Ctrl+Shift+Z)">↷</button>
    <button class="btn" id="ioBtn" type="button">Export / Import</button>
  </header>

  <main class="work">
    <aside class="panel" aria-label="Bauteile und Ebenen">
      <h2>Bauteile</h2>
      <div class="presets" id="presets"></div>
      <h2>Ebenen</h2>
      <div class="layers" id="layers"></div>
    </aside>

    <section class="stage" id="stage">
      <canvas id="cv" tabindex="0" aria-label="Canvas mit Spielfeldern"></canvas>
      <div class="overlay-tl" id="tl"></div>
      <div class="banner" id="banner" hidden></div>
      <div class="tips" id="tips"></div>
      <div class="zoom">
        <button class="btn iconbtn" id="zOut" type="button" title="Herauszoomen (-)">−</button>
        <button class="chip" id="zLbl" type="button" title="Alles zeigen (Shift+1)">100%</button>
        <button class="btn iconbtn" id="zIn" type="button" title="Hineinzoomen (+)">+</button>
      </div>
    </section>

    <aside class="panel" aria-label="Eigenschaften"><div class="insp" id="insp"></div></aside>
  </main>

  <div class="modal" id="ioModal" hidden>
    <div class="mbox" role="dialog" aria-label="Export und Import">
      <h3>Export / Import</h3>
      <p>Das ganze Board als JSON: alle Spielfelder, Bauteile und Einstellungen. Kopieren und aufbewahren, oder anderes JSON einfügen. „Hinzufügen" legt die Spielfelder daraus neben die bestehenden.</p>
      <textarea id="ioText" spellcheck="false"></textarea>
      <div class="mrow">
        <button class="btn" id="ioCopy" type="button">Kopieren</button>
        <button class="btn primary" id="ioAdd" type="button">Hinzufügen</button>
        <button class="btn danger" id="ioReplace" type="button">Board ersetzen</button>
        <label class="btn" for="ioFile">JSON-Datei öffnen</label>
        <input type="file" id="ioFile" accept=".json,application/json" hidden>
        <button class="btn" id="ioSample" type="button">Skizze 1 neu anlegen</button>
        <button class="btn" id="ioClose" type="button" style="margin-left:auto">Schliessen</button>
      </div>
      <div class="msg" id="ioMsg"></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const DEG=Math.PI/180;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const uid=()=>Math.random().toString(36).slice(2,10);
const deep=o=>JSON.parse(JSON.stringify(o));
const normAng=a=>((a+180)%360+360)%360-180;
const r1=v=>Math.round(v*10)/10;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

/* ================= Konstanten ================= */
const PL={1:{fill:'#5ccf6e',edge:'#2c8a41',name:'Spieler 1',kh:'A   D',kv:'W   S'},2:{fill:'#42a9ff',edge:'#1c6cbc',name:'Spieler 2',kh:'←   →',kv:'↑   ↓'}};
const KEYS={1:{l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS'},2:{l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown'}};
const EFF={normal:'Normal',bounce:'Bounce',reset:'Neustart',slick:'Glatt',grip:'Griffig'};
const STATIC_FILL={normal:'#a2a8a5',bounce:'#f2501f',reset:'#1e2120',slick:'#9fdcef',grip:'#8b5e3f'};
const SEESAW_FILL='#d9a520';
const SEC_DEF={gravity:2000,restitution:0.25,friction:0.5,bounce:1,maxSpeed:2600,rotLimit:35,rotSpeed:110,rotRamp:120,rotSpring:false,rangeScale:100,slideSpeed:380,slideRamp:100,slideSpring:false,seesawMass:2,seesawDamp:2,seesawReturn:6,winRule:'all'};
const PREF_DEF={snap:true,grid:10,trail:true,timeScale:1,waitStart:true};
const R=(k,label,min,max,step,unit,hint)=>({k,label,min,max,step,unit,hint,t:'range'});
const B=(k,label,hint)=>({k,label,hint,t:'bool'});
const SEC_GROUPS=[
 {g:'Kugel & Physik',open:true,items:[R('gravity','Schwerkraft',100,6000,50,'px/s²'),R('restitution','Abprall normal',0,0.9,0.05,'','0 = klebt · 0.9 = springt stark'),R('friction','Reibung',0,1.5,0.05,'','wie stark die Kugel rollt statt rutscht'),R('bounce','Bounce-Stärke',0.5,1.5,0.05,'×','1 = gleiche Geschwindigkeit zurück'),R('maxSpeed','Max. Tempo',400,5000,100,'px/s')]},
 {g:'Rotationsbalken',items:[R('rotLimit','Rotationslimit',0,180,1,'±°','Standard für alle ohne eigenes Limit · 180 = frei'),R('rotSpeed','Drehtempo',10,400,5,'°/s'),R('rotRamp','Reaktionszeit',0,600,10,'ms','bis volles Tempo · 0 = sofort'),B('rotSpring','Federt beim Loslassen zurück')]},
 {g:'Schieber',items:[R('rangeScale','Range',10,200,5,'%','skaliert alle Schienen · 100 = wie gezeichnet'),R('slideSpeed','Schiebetempo',20,1200,10,'px/s'),R('slideRamp','Reaktionszeit',0,600,10,'ms'),B('slideSpring','Federt zur Mitte zurück')]},
 {g:'Wippe',items:[R('seesawMass','Trägheit',0.5,10,0.5,'×','im Verhältnis zur Kugel'),R('seesawDamp','Dämpfung',0,10,0.5,''),R('seesawReturn','Rückstellkraft',0,40,1,'')]},
];
const PREF_ITEMS=[B('waitStart','Kugel wartet auf Leertaste'),R('timeScale','Zeitlupe / Tempo',0.2,1.5,0.05,'×'),B('trail','Spur der Kugel zeigen'),B('snap','Am Raster einrasten','Shift beim Drehen = 15°-Schritte'),R('grid','Rastergrösse',5,50,5,'px')];
const findItem=k=>{for(const g of SEC_GROUPS)for(const it of g.items)if(it.k===k)return it; return PREF_ITEMS.find(i=>i.k===k);};

const SVG={
 wall:'<rect x="2" y="9" width="36" height="8" fill="#1e2120"/>',
 bounce:'<rect x="2" y="9" width="36" height="8" fill="#f2501f"/>',
 plat:'<rect x="2" y="9" width="36" height="8" fill="#a2a8a5"/>',
 rotor:'<g transform="rotate(-14 20 13)"><rect x="3" y="9" width="34" height="9" fill="#5ccf6e"/></g><circle cx="20" cy="13" r="2.4" fill="#fff" stroke="#1e2120"/>',
 slider:'<line x1="2" y1="22" x2="38" y2="4" stroke="#1e2120"/><g transform="rotate(-10 20 13)"><rect x="11" y="8.5" width="18" height="9" fill="#42a9ff"/></g>',
 seesaw:'<g transform="rotate(10 20 11)"><rect x="3" y="8" width="34" height="6" fill="#d9a520"/></g><path d="M20 13 L15 23 L25 23 Z" fill="#1e2120"/>',
 pin:'<circle cx="20" cy="13" r="7" fill="#f2501f"/>',
 wheel:'<circle cx="20" cy="13" r="10" fill="#5ccf6e"/><path d="M20 13 L20 5 M20 13 L27 17 M20 13 L13 17" stroke="#fff" stroke-width="1.6"/>',

function checkRules(sm){
  if(sm.phase!=='run')return;
  const S=sm.sec.settings; let alive=0,parked=0,lost=0;
  for(const b of sm.balls){ if(b.alive)alive++; if(b.parked)parked++; if(b.lost)lost++; }
  if(S.winRule==='any'){ if(parked) win(sm); else if(!alive) fail(sm); }
  else { if(lost) fail(sm); else if(!alive&&parked) win(sm); }
}
function win(sm){sm.phase='win'; sm.wins++; sm.lastWin=sm.t; if(sm.best==null||sm.t<sm.best) sm.best=sm.t;}
function fail(sm){sm.phase='fail'; sm.msgT=1.5;}
function physStep(dt){
  const sm=sim, S=sm.sec.settings, sec=sm.sec, els=elsOf(sec.id);
  updateMovers(dt,els,S);
  if(sm.phase!=='run') return;
  sm.t+=dt;
  const cols=[]; for(const e of els) if(isBody(e)){const g=geo(e); g.e=e; cols.push(g);}
  const balls=sm.balls;
  for(const b of balls){ if(!b.alive||b.sleep)continue;
    b.vy+=S.gravity*dt; const sp=Math.hypot(b.vx,b.vy); if(sp>S.maxSpeed){const f=S.maxSpeed/sp; b.vx*=f; b.vy*=f;}
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.ang+=b.w*dt; b.w*=1-0.12*dt; }
  for(let it=0;it<2;it++){
    for(const b of balls){ if(!b.alive)continue;
      for(const g of cols){ const c=g.k==='r'?hitRect(g,b.x,b.y,b.r):hitCircle(g,b.x,b.y,b.r); if(!c)continue;
        if(b.sleep){const [vx,vy]=velAt(g.mot,c.cx,c.cy); if(Math.hypot(vx,vy)>5) b.sleep=false; else continue;}
        if(g.e.effect==='reset'){loseBall(sm,b,'reset'); break;} resolve(b,g,c,S); } }
    for(let i=0;i<balls.length;i++){const a=balls[i]; if(!a.alive)continue;
      for(let j=i+1;j<balls.length;j++){const b=balls[j]; if(!b.alive)continue;
        const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), rs=a.r+b.r; if(d>=rs||d===0)continue;
        if(a.sleep||b.sleep){ if(a.sleep&&b.sleep) continue; a.sleep=false; b.sleep=false; }
        const nx=dx/d, ny=dy/d, ma=a.r*a.r, mb=b.r*b.r, tot=ma+mb, pen=rs-d;
        a.x-=nx*pen*mb/tot; a.y-=ny*pen*mb/tot; b.x+=nx*pen*ma/tot; b.y+=ny*pen*ma/tot;
        const vr=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny; if(vr<0){const e=Math.min(S.restitution+0.3,0.9), jj=-(1+e)*vr/(1/ma+1/mb);
          a.vx-=jj/ma*nx; a.vy-=jj/ma*ny; b.vx+=jj/mb*nx; b.vy+=jj/mb*ny;} } }
  }
  for(const b of balls){ if(!b.alive)continue;
    if(b.x<sec.x-b.r*3||b.x>sec.x+sec.w+b.r*3||b.y>sec.y+sec.h+b.r*3||b.y<sec.y-sec.h){loseBall(sm,b,'out'); continue;}
    for(const e of els){
      if(e.kind==='goal'){const g=geo(e); if(Math.hypot(b.x-g.cx,b.y-g.cy)<g.r){b.alive=false; b.parked=true; break;}}
      else if(e.kind==='spawn'){const g=geo(e);
        if(Math.hypot(b.x-g.cx,b.y-g.cy)<g.r+b.r*0.6&&!(e.once&&sm.triggered.has(e.id))&&!(sm.cd[e.id]>0)&&balls.length<8){
          const [sx,sy]=xf(g.mot,e.x+e.dx,e.y+e.dy); balls.push(mkBall(sx,sy,e.br,balls.length+1)); sm.triggered.add(e.id); sm.cd[e.id]=1.2;}}
    }
  }
  for(const k in sm.cd) sm.cd[k]-=dt;
  checkRules(sm);
  sm.trT+=dt; if(sm.trT>1/50){sm.trT=0; for(const b of balls) if(b.alive) sm.trail.push({x:b.x,y:b.y}); if(sm.trail.length>300) sm.trail.splice(0,sm.trail.length-300);}
}

function cssSize(){return {w:cv.clientWidth||1,h:cv.clientHeight||1};}

const toWorld=ev=>{const r=cv.getBoundingClientRect(); return {x:cam.x+(ev.clientX-r.left)/cam.z, y:cam.y+(ev.clientY-r.top)/cam.z};};

function camFor(x,y,w,h,pad){const {w:W,h:H}=cssSize(); const top=48, bot=40; const z=clamp(Math.min((W-2*pad)/w,(H-top-bot-2*pad)/h),0.04,6); return {z,x:x+w/2-W/2/z,y:y+h/2-(H+top-bot)/2/z};}
function goCam(t,instant){const rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches; if(instant||rm){cam=Object.assign({},t); camAnim=null; saveDoc(); return;} camAnim={from:Object.assign({},cam),to:t,t:0};}
function bboxAll(){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  const add=(a,b,c,d)=>{x0=Math.min(x0,a);y0=Math.min(y0,b);x1=Math.max(x1,c);y1=Math.max(y1,d);};
  for(const s of doc.sections) add(s.x,s.y-30,s.x+s.w,s.y+s.h);
  for(const e of looseEls()){const r=e.r||Math.max(e.w||0,e.h||0)/2; add(e.x-r,e.y-r,e.x+r,e.y+r);}
  if(!isFinite(x0)) return {x:-500,y:-400,w:1000,h:800};
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function fitAll(instant){const b=bboxAll(); goCam(camFor(b.x,b.y,b.w,b.h,40),instant);}
function fitSec(s,instant){goCam(camFor(s.x,s.y,s.w,s.h,24),instant);}
function fitSel(){
  const ids=[...sel]; if(!ids.length){const f=focusSec(); return f?fitSec(f):fitAll();}
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const id of ids){const s=secById(id); if(s){x0=Math.min(x0,s.x);y0=Math.min(y0,s.y);x1=Math.max(x1,s.x+s.w);y1=Math.max(y1,s.y+s.h);continue;}
    const e=elById(id); if(!e)continue; const r=e.r||Math.hypot(e.w||0,e.h||0)/2; x0=Math.min(x0,e.x-r);y0=Math.min(y0,e.y-r);x1=Math.max(x1,e.x+r);y1=Math.max(y1,e.y+r);}
  if(isFinite(x0)) goCam(camFor(x0,y0,Math.max(60,x1-x0),Math.max(60,y1-y0),60));

function zoomAt(f,sx,sy){const wx=cam.x+sx/cam.z, wy=cam.y+sy/cam.z; cam.z=clamp(cam.z*f,0.04,8); cam.x=wx-sx/cam.z; cam.y=wy-sy/cam.z; camAnim=null; saveDoc();}

function drawRail(e){

function drawSelection(tk){

/* ================= Griffe ================= */
const single=()=>sel.size===1?findAny([...sel][0]):null;

  const e=o;
  if(e.kind==='rect'){
    const a=(e.a||0)*DEG,c=Math.cos(a),s=Math.sin(a),P=(lx,ly)=>({x:e.x+lx*c-ly*s,y:e.y+lx*s+ly*c});

    const A=P(0,-e.h/2), Q=P(0,-e.h/2-24*px); H.push({k:'rot',x:Q.x,y:Q.y,ax:A.x,ay:A.y});

    H.push({k:'rmin',x:e.x+ux*e.rMin*sc,y:e.y+uy*e.rMin*sc},{k:'rmax',x:e.x+ux*e.rMax*sc,y:e.y+uy*e.rMax*sc});}

}
function hitHandle(o,w){const hs=handlesOf(o); for(let i=hs.length-1;i>=0;i--){const h=hs[i]; if(Math.hypot(h.x-w.x,h.y-w.y)*cam.z<(h.small?6:8)) return h;} return null;}

/* ================= Picking ================= */
function hitEl(e,w,tol){const g=geo(e); if(g.k==='r') return !!hitRect(g,w.x,w.y,tol); return Math.hypot(w.x-g.cx,w.y-g.cy)<g.r+tol;}

  for(let i=doc.sections.length-1;i>=0;i--){const s=doc.sections[i]; if(inSec(s,w)) return pickIn(elsOf(s.id),w)||s;}

}
function hitLabel(ev){const r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top; for(let i=labelRects.length-1;i>=0;i--){const l=labelRects[i]; if(x>=l.x&&x<=l.x+l.w&&y>=l.y&&y<=l.y+l.h) return secById(l.id);} return null;}

/* ================= Snap ================= */
const snapV=v=>doc.prefs.snap?Math.round(v/doc.prefs.grid)*doc.prefs.grid:r1(v);

/* ================= Erstellen ================= */
function createBody(kind,props,x,y){
  const e=mkEl(kind,Object.assign({x:r1(x),y:r1(y)},props)); reparent(e); doc.elements.push(e); return e;
}
function placeKind(kind,x,y){
  x=snapV(x); y=snapV(y);

}
function placePreset(key,x,y){

/* ================= Selektion ================= */

/* ================= Zeiger ================= */

  if(tool==='attach'){const hit=pick(w); if(isMover(hit)&&!attachSrc.includes(hit.id)){ for(const id of attachSrc){const e=elById(id); if(e&&!isMover(e)){e.parent=hit.id; reparent(e);}} flash('Angeheftet an '+displayName(hit)); commit(); }
    else flash('Kein beweglicher Balken getroffen – Anheften abgebrochen');
    setTool('select'); renderAll(); return;}
  const one=single();
  if(one){const h=hitHandle(one,w); if(h){beginHandle(h,one,w,ev); return;}}
  const hit=hitLabel(ev)||pick(w);
  if(hit){
    if(ev.shiftKey){ if(sel.has(hit.id)) sel.delete(hit.id); else sel.add(hit.id); renderLayers(); renderInspector(); if(!sel.has(hit.id)) return; }
    else if(!sel.has(hit.id)) {selectOnly(hit.id); renderLayers(); renderInspector();}
    if(ev.altKey&&mode==='build'){ duplicateSel(0,0); }
    beginMove(w,ev,hit); return;
  }
  if(!ev.shiftKey){clearSel(); renderLayers(); renderInspector();}
  ptr={k:'marquee',x0:w.x,y0:w.y,x1:w.x,y1:w.y,base:new Set(sel)}; cv.setPointerCapture(ev.pointerId);
});
function beginMove(w,ev,hit){
  const origs=new Map(), direct=[];
  const add=t=>{if(!origs.has(t.id)) origs.set(t.id,{x:t.x,y:t.y});};
  for(const id of sel){const s=secById(id); if(s){add(s); for(const e of elsOf(s.id)) add(e);} }
  for(const id of sel){const e=elById(id); if(!e)continue; if(origs.has(e.id)&&secById(e.sec)&&sel.has(e.sec)) continue; add(e); direct.push(e.id);
    if(isMover(e)) for(const c of doc.elements) if(c.parent===e.id){add(c); direct.push(c.id);} }
  const anchorT=findAny(hit.id)||hit;

}
function beginHandle(h,o,w,ev){
  const kids=[]; if(isMover(o)) for(const c of doc.elements) if(c.parent===o.id) kids.push([c,{x:c.x,y:c.y,a:c.a||0}]);

cv.addEventListener('pointermove',ev=>{
  const w=toWorld(ev);

  if(ptr.k==='draw'){ptr.x1=snapV(w.x); ptr.y1=snapV(w.y); if(ev.shiftKey&&ptr.tool!=='rect'){const d=Math.max(Math.abs(ptr.x1-ptr.x0),Math.abs(ptr.y1-ptr.y0)); ptr.x1=ptr.x0+Math.sign(ptr.x1-ptr.x0||1)*d; ptr.y1=ptr.y0+Math.sign(ptr.y1-ptr.y0||1)*d;} return;}
  if(ptr.k==='marquee'){ptr.x1=w.x; ptr.y1=w.y; marqueeSelect(); return;}
  const dx=w.x-ptr.sx, dy=w.y-ptr.sy;
  if(!ptr.moved&&Math.hypot(dx,dy)*cam.z<3) return;
  ptr.moved=true;
  if(ptr.k==='move'){
    let ddx=dx, ddy=dy; if(doc.prefs.snap){ddx=snapV(ptr.anchor.x+dx)-ptr.anchor.x; ddy=snapV(ptr.anchor.y+dy)-ptr.anchor.y;}
    for(const [id,o] of ptr.origs){const t=findAny(id); if(t){t.x=r1(o.x+ddx); t.y=r1(o.y+ddy);}}

function dragHandle(w,ev){

cv.addEventListener('pointerup',ev=>{
  if(!ptr)return; const p=ptr; ptr=null;

  if(p.k==='draw'){finishDraw(p); return;}
  if(p.k==='marquee'){renderLayers(); renderInspector(); return;}

});
cv.addEventListener('dblclick',ev=>{
  const w=toWorld(ev); const lab=hitLabel(ev);

  if(!focusId){
    const hit=pick(w); const sid=hit?(secById(hit.id)?hit.id:hit.sec):secAt(w.x,w.y);
    if(sid&&secById(sid)){enterFocus(sid); if(hit&&!secById(hit.id)){selectOnly(hit.id); renderAll();}}
  } else { const f=focusSec(); if(f&&!inSec(f,w)){const sid=secAt(w.x,w.y); if(sid) enterFocus(sid); else exitFocus();} }
});
cv.addEventListener('contextmenu',ev=>ev.preventDefault());
function hoverUpdate(w,ev){

    else {const lab=hitLabel(ev); const t=lab||pick(w); if(t){hv=t.id; c='default';}}

function resizeCursor(h,o){ let a=Math.atan2(h.sy||0,h.sx||0)/DEG+(o.a||0); a=((a%180)+180)%180; return a<22.5||a>=157.5?'ew-resize':a<67.5?'nwse-resize':a<112.5?'ns-resize':'nesw-resize'; }
function marqueeSelect(){
  const x0=Math.min(ptr.x0,ptr.x1), x1=Math.max(ptr.x0,ptr.x1), y0=Math.min(ptr.y0,ptr.y1), y1=Math.max(ptr.y0,ptr.y1);
  const s=new Set(ptr.base);
  const inside=e=>{const g=geo(e); return g.cx>=x0&&g.cx<=x1&&g.cy>=y0&&g.cy<=y1;};
  if(focusId){ for(const e of elsOf(focusId)) if(inside(e)) s.add(e.id); }
  else { for(const sc of doc.sections) if(sc.x<x1&&sc.x+sc.w>x0&&sc.y<y1&&sc.y+sc.h>y0) s.add(sc.id); }

}

},{passive:false});

/* ================= Aktionen ================= */
function duplicateSel(ox,oy){
  const ids=[...sel], idMap=new Map(), newEls=[], newSecs=[];
  const right=rightEdge();
  for(const id of ids){const s=secById(id); if(!s)continue; const c=deep(s); c.id=uid(); c.name=s.name+' (Kopie)'; c.x=ox===0&&oy===0?s.x:right+200; idMap.set(s.id,c.id); newSecs.push(c);
    const dx=c.x-s.x; for(const e of elsOf(s.id)){const ce=deep(e); ce.id=uid(); idMap.set(e.id,ce.id); ce.sec=c.id; ce.x+=dx; newEls.push(ce);} }
  const elIds=new Set(); for(const id of ids){const e=elById(id); if(!e||idMap.has(e.id))continue; elIds.add(e.id); if(isMover(e)) for(const c of doc.elements) if(c.parent===e.id) elIds.add(c.id);}
  for(const id of elIds){const e=elById(id); if(idMap.has(id))continue; const ce=deep(e); ce.id=uid(); idMap.set(e.id,ce.id); ce.x+=ox; ce.y+=oy; newEls.push(ce);}
  for(const e of newEls){ if(e.parent&&idMap.has(e.parent)) e.parent=idMap.get(e.parent); if(e.kind==='start'){} }
  doc.sections.push(...newSecs); doc.elements.push(...newEls);
  for(const e of newEls) if(!newSecs.find(s=>s.id===e.sec)) reparent(e);
  const top=new Set(); for(const id of ids) if(idMap.has(id)) top.add(idMap.get(id));
  sel=top;
}
function deleteSel(){
  const ids=[...sel]; if(!ids.length)return;
  const del=new Set(ids);
  for(const id of ids){const s=secById(id); if(s) for(const e of elsOf(s.id)) del.add(e.id);}
  doc.sections=doc.sections.filter(s=>!del.has(s.id));
  doc.elements=doc.elements.filter(e=>!del.has(e.id));
  for(const e of doc.elements) if(e.parent&&del.has(e.parent)) e.parent=null;
  if(focusId&&del.has(focusId)){ if(mode==='test') setMode('build'); focusId=null; }
  sel=new Set(); commit(); renderAll();
}
let clip=null;
function copySel(){
  const ids=[...sel]; if(!ids.length)return;
  const secs=[], els=[]; const inc=new Set();
  for(const id of ids){const s=secById(id); if(s){secs.push(deep(s)); for(const e of elsOf(s.id)){els.push(deep(e)); inc.add(e.id);}}}
  for(const id of ids){const e=elById(id); if(e&&!inc.has(e.id)){els.push(deep(e)); inc.add(e.id); if(isMover(e)) for(const c of doc.elements) if(c.parent===e.id&&!inc.has(c.id)){els.push(deep(c)); inc.add(c.id);}}}
  clip={secs,els,n:0}; flash(`${ids.length} kopiert`);
}
function paste(){
  if(!clip)return; clip.n++; const off=clip.n*20, idMap=new Map(), right=rightEdge(), top=new Set();
  const secs=clip.secs.map(s=>{const c=deep(s); c.id=uid(); idMap.set(s.id,c.id); c.dx=right+200-s.x; c.x=right+200; top.add(c.id); return c;});
  const els=clip.els.map(e=>{const c=deep(e); c.id=uid(); idMap.set(e.id,c.id); return c;});
  for(const e of els){ const ns=e.sec&&idMap.get(e.sec); if(ns){const s=secs.find(q=>q.id===ns); e.x+=s.dx; e.sec=ns;} else {e.x+=off; e.y+=off; top.add(e.id);} if(e.parent) e.parent=idMap.get(e.parent)||null; }
  for(const s of secs) delete s.dx;
  doc.sections.push(...secs); doc.elements.push(...els);
  for(const e of els) if(!secs.find(s=>s.id===e.sec)) reparent(e);
  sel=top; commit(); renderAll();
}
function nudge(dx,dy){
  const moved=new Set();
  const mv=t=>{if(moved.has(t.id))return; moved.add(t.id); t.x=r1(t.x+dx); t.y=r1(t.y+dy);};
  for(const id of sel){const s=secById(id); if(s){mv(s); for(const e of elsOf(s.id)) mv(e);}}
  for(const id of sel){const e=elById(id); if(e){mv(e); if(isMover(e)) for(const c of doc.elements) if(c.parent===e.id) mv(c); reparent(e);}}
  syncFields(); commit();
}
function rotateSel(d){
  for(const id of sel){const e=elById(id); if(!e||e.kind!=='rect'&&e.kind!=='circle')continue; const old=e.a||0; e.a=normAng(old+d);
    if(isMover(e)){const rr=d*DEG,c=Math.cos(rr),s=Math.sin(rr); for(const k of doc.elements) if(k.parent===e.id){const dx=k.x-e.x,dy=k.y-e.y; k.x=r1(e.x+dx*c-dy*s); k.y=r1(e.y+dx*s+dy*c); k.a=normAng((k.a||0)+d);}}}
  syncFields(); commit();
}
function enterFocus(id){const s=secById(id); if(!s)return; focusId=id; sel=new Set(); fitSec(s); renderAll();}
function exitFocus(){ if(mode==='test') setMode('build'); const id=focusId; focusId=null; sel=new Set(id&&secById(id)?[id]:[]); fitAll(); renderAll(); }

function syncFields(){
  const one=single(); if(!one)return; const t=secById(one.id)?'sec':'el';

function moveKids(e,dx,dy){ if(isMover(e)) for(const c of doc.elements) if(c.parent===e.id){c.x=r1(c.x+dx); c.y=r1(c.y+dy);} }
function setElProp(e,k,v){
  if(k==='x'||k==='y'){const d=v-e[k]; e[k]=v; moveKids(e,k==='x'?d:0,k==='y'?d:0); reparent(e); return;}
  if(k==='a'){const d=v-(e.a||0); e.a=v; if(isMover(e)){const rr=d*DEG,c=Math.cos(rr),s=Math.sin(rr); for(const kd of doc.elements) if(kd.parent===e.id){const dx=kd.x-e.x,dy=kd.y-e.y; kd.x=r1(e.x+dx*c-dy*s); kd.y=r1(e.y+dx*s+dy*c); kd.a=normAng((kd.a||0)+d);}} return;}
  if(['w','h','r','br'].includes(k)){e[k]=Math.max(k==='h'?2:3,v); return;}
  if(k==='lim'){e.lim=Math.max(0,v); return;}
  e[k]=v;
}
function onField(ev,isChange){
  const t=ev.target, k=t.dataset.k, tg=t.dataset.t; if(!k||!tg)return;
  const isSel=t.tagName==='SELECT', isChk=t.type==='checkbox', isNum=t.type==='number', isRange=t.type==='range', isText=t.type==='text'||t.classList.contains('txt');
  if((isSel||isChk)&&!isChange) return;
  if((isNum||isText)&&isChange){commit(); return;}
  if(isRange&&isChange){ if(tg!=='pref') commit(); t.blur(); return; }
  let v=isChk?t.checked:(isNum||isRange)?parseFloat(t.value):t.value;
  if((isNum||isRange)&&!isFinite(v)) return;
  if(tg==='pref'){doc.prefs[k]=v; const it=findItem(k), o=document.getElementById('o-pref-'+k); if(o&&it)o.textContent=fmtSet(it,v); saveDoc(); return;}
  if(tg==='set'){const s=secById(inspSecId); if(!s)return; s.settings[k]=v; const it=findItem(k), o=document.getElementById('o-set-'+k); if(o&&it&&it.t==='range')o.textContent=fmtSet(it,v);
    if(isSel||isChk){commit(); if(k==='winRule') renderInspector(); t.blur();} saveDoc(); return;}
  if(tg==='sec'){const s=secById(inspSecId)||single(); if(!s)return;
    if(k==='name'){s.name=v||'Spielfeld'; renderLayers(); saveDoc(); return;}
    if(k==='x'||k==='y'){const d=v-s[k]; s[k]=v; for(const e of elsOf(s.id)) e[k]=r1(e[k]+d); return;}
    if(k==='w'||k==='h'){s[k]=Math.max(100,v); return;} return;}
  if(tg==='multi'){ if(k==='effect'&&v){for(const id of sel){const e=elById(id); if(isBody(e)) e.effect=v;} commit(); renderInspector(); t.blur();} return; }
  if(tg==='el'){const e=single(); if(!e||!elById(e.id))return;
    if(k==='limOwn'){e.lim=v?settingsOf(e).rotLimit:null; commit(); renderInspector(); return;}
    if(k==='parent'){e.parent=v||null; reparent(e); commit(); renderAll(); t.blur(); return;}
    if(k==='once'||k==='sleep'){e[k]=v; commit(); renderLayers(); return;}
    if(isSel){e[k]=v; commit(); renderInspector(); renderLayers(); t.blur(); return;}
    setElProp(e,k,v);
  }
}

/* ================= Tastatur ================= */
const GAME_CODES=new Set(['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space']);
window.addEventListener('keydown',ev=>{
  const tag=(ev.target.tagName||'').toLowerCase();
  const typing=(tag==='input'&&!['range','checkbox'].includes(ev.target.type))||tag==='textarea'||tag==='select';
  if(!modal.hidden){if(ev.key==='Escape') modal.hidden=true; return;}
  if(typing){if(ev.key==='Escape') ev.target.blur(); return;}
  const mod=ev.ctrlKey||ev.metaKey;
  if(mod&&ev.code==='KeyZ'){ev.preventDefault(); ev.shiftKey?redo():undo(); return;}
  if(mod&&ev.code==='KeyY'){ev.preventDefault(); redo(); return;}
  if(mod&&(ev.code==='Equal'||ev.code==='NumpadAdd')){ev.preventDefault(); $('#zIn').click(); return;}
  if(mod&&(ev.code==='Minus'||ev.code==='NumpadSubtract')){ev.preventDefault(); $('#zOut').click(); return;}
  if(mode==='test'){
    if(mod) return;
    if(GAME_CODES.has(ev.code)){ev.preventDefault(); if(tag==='input'||tag==='button') ev.target.blur();}
    keys.add(ev.code);
    if(ev.code==='Escape'){setMode('build'); return;}
    if(ev.code==='Space'&&!ev.repeat){ if(sim.phase==='ready'){sim.phase='run'; sim.attempts++;} else if(sim.phase==='win') newRound(sim); return; }
    if(ev.code==='KeyR'&&!ev.repeat){sim.marks=[]; newRound(sim); return;}
    if(ev.code==='KeyP'&&!ev.repeat){sim.paused=!sim.paused; return;}
    return;
  }
  if(mod){
    if(ev.code==='KeyD'){ev.preventDefault(); duplicateSel(20,20); commit(); renderAll();}
    if(ev.code==='KeyC'){ev.preventDefault(); copySel();}
    if(ev.code==='KeyV'){ev.preventDefault(); paste();}
    if(ev.code==='KeyA'){ev.preventDefault(); sel=new Set(focusId?elsOf(focusId).map(e=>e.id):doc.sections.map(s=>s.id)); renderAll();}
    return;
  }
  if(ev.code==='Space'){ if(tag==='button') return; ev.preventDefault(); if(!spaceDown){spaceDown=true; cv.style.cursor='grab';} return; }
  if(ev.shiftKey&&ev.code==='Digit1'){ev.preventDefault(); fitAll(); return;}
  if(ev.shiftKey&&ev.code==='Digit2'){ev.preventDefault(); fitSel(); return;}
  if(ev.code==='Enter'&&tag!=='button'){ev.preventDefault();
    if(focusId) setMode('test'); else {const s=[...sel].map(secById).find(Boolean); if(s) enterFocus(s.id); else setMode('test');} return;}
  if(ev.code==='Escape'){ if(tool!=='select'){setTool('select'); renderInspector(); return;} if(sel.size){sel=new Set(); renderAll(); return;} if(focusId) exitFocus(); return; }
  if(ev.code==='Delete'||ev.code==='Backspace'){if(sel.size){ev.preventDefault(); deleteSel();} return;}
  const st1=ev.shiftKey?10:1;
  const nd={ArrowLeft:[-st1,0],ArrowRight:[st1,0],ArrowUp:[0,-st1],ArrowDown:[0,st1]}[ev.code];
  if(nd&&sel.size){ev.preventDefault(); nudge(nd[0],nd[1]); return;}
  if(ev.code==='KeyQ'||ev.code==='KeyE'){if(sel.size) rotateSel((ev.code==='KeyE'?1:-1)*(ev.shiftKey?1:5)); return;}
  const toolKeys={KeyV:['select'],KeyH:['hand'],KeyF:['section'],KeyR:['rect'],KeyO:['circle'],KeyG:['place','goal'],KeyB:['place','start'],KeyM:['place','spawn']};
  const tk=toolKeys[ev.code]; if(tk&&!ev.repeat){setTool(tk[0],tk[1]); renderInspector();}
  if(ev.code==='Equal'||ev.code==='NumpadAdd') $('#zIn').click();
  if(ev.code==='Minus'||ev.code==='NumpadSubtract') $('#zOut').click();
});

function parseImport(txt){
  const o=JSON.parse(txt);
  if(o&&Array.isArray(o.sections)&&Array.isArray(o.elements)) return {sections:o.sections,elements:o.elements,prefs:o.prefs};
  if(o&&Array.isArray(o.elements)){const {sec,els}=fromV1(o,0,0); return {sections:[sec],elements:els};}
  throw new Error('weder Board noch Spielfeld erkannt');
}
function addImported(d){
  const idMap=new Map(); let x=rightEdge()+200; const minX=Math.min(...d.sections.map(s=>s.x),0);
  const secs=d.sections.map(s=>{const c=deep(s); c.id=uid(); idMap.set(s.id,c.id); c.settings=Object.assign(deep(SEC_DEF),c.settings||{}); return c;});
  const shift=x-minX;
  for(const s of secs) s.x+=shift;
  const els=d.elements.map(e=>{const c=Object.assign(mkEl(e.kind in BASE?e.kind:'rect'),deep(e)); c.id=uid(); idMap.set(e.id,c.id); c.x+=shift; return c;});
  for(const e of els){e.sec=e.sec&&idMap.get(e.sec)||null; e.parent=e.parent&&idMap.get(e.parent)||null;}
  doc.sections.push(...secs); doc.elements.push(...els); for(const e of els) if(!e.sec) reparent(e);
  sel=new Set(secs.map(s=>s.id)); commit(); renderAll(); fitAll();
}

/* ================= Loop ================= */
let last=performance.now(), acc=0; const STEP=1/240;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(camAnim){camAnim.t+=dt/0.32; const t=Math.min(1,camAnim.t), k=1-Math.pow(1-t,3), f=camAnim.from, to=camAnim.to;
    const z=Math.exp(Math.log(f.z)+(Math.log(to.z)-Math.log(f.z))*k);
    const {w,h}=cssSize(); const fcx=f.x+w/2/f.z, fcy=f.y+h/2/f.z, tcx=to.x+w/2/to.z, tcy=to.y+h/2/to.z;
    cam.z=z; cam.x=fcx+(tcx-fcx)*k-w/2/z; cam.y=fcy+(tcy-fcy)*k-h/2/z;
    if(t>=1){cam=Object.assign({},to); camAnim=null; saveDoc();}}
  if(mode==='test'&&sim&&!sim.paused){
    acc+=dt*doc.prefs.timeScale; let n=0;
    while(acc>=STEP&&n<60){physStep(STEP); acc-=STEP; n++;}
    if(sim.phase==='fail'){sim.msgT-=dt; if(sim.msgT<=0) newRound(sim);}
  } else acc=0;
  draw(); updateHud();
